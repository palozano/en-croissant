# HTTP bootstrap. Add HTTPS after chess.carola.work resolves to this server.
server {
    server_name chess.carola.work;
    root /var/www/chess.carola.work/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chess.carola.work/acme;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /stockfish/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chess.carola.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chess.carola.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = chess.carola.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name chess.carola.work;
    return 404; # managed by Certbot


}